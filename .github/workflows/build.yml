name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  # The shipped artifact is the Windows executable. The macOS app is built
  # locally (scripts/build_macos.sh) and is not part of the release.
  build-windows:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[gui]" "pyinstaller>=6.6,<7"
      # The version lives in one place (src/wzsearch/__init__.py); this writes
      # the PE resource so the executable carries its own version.
      - name: Version resource
        run: python scripts/make_version_info.py
      - name: Build the app
        run: >
          pyinstaller --onefile --windowed --name wzsearch --paths src
          --version-file packaging/version_info.txt
          --icon packaging\icon.ico
          --collect-all tkinterdnd2 --collect-all pillow_heif
          packaging/wzsearch_gui_entry.py
      - name: Package the release zip
        shell: pwsh
        run: Compress-Archive -Path "dist/wzsearch.exe" -DestinationPath "wzsearch-windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: wzsearch-windows
          path: wzsearch-windows.zip

  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
