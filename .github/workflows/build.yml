name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: wzsearch-windows
          - os: ubuntu-latest
            artifact: wzsearch-linux
          - os: macos-latest
            artifact: wzsearch-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "pyinstaller>=6.6,<7"
      - run: pyinstaller --onefile --name wzsearch --paths src packaging/wzsearch_entry.py
      - name: Add drag-and-drop helpers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item packaging/windows/* dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
