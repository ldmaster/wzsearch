name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "pyinstaller>=6.6,<7"
      - name: Install GUI dependencies (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -e ".[gui]"
      - name: Build CLI (Linux)
        if: runner.os != 'Windows'
        run: pyinstaller --onefile --name wzsearch --paths src packaging/wzsearch_entry.py
      - name: Build GUI (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --onefile --windowed --name wzsearch --paths src
          --icon packaging\icon.ico
          --collect-all tkinterdnd2 --collect-all pillow_heif
          packaging/wzsearch_gui_entry.py
      - name: Package zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "wzsearch-${{ matrix.name }}.zip"
      - name: Package zip (Linux)
        if: runner.os != 'Windows'
        run: chmod +x dist/wzsearch && zip -j "wzsearch-${{ matrix.name }}.zip" dist/wzsearch
      - uses: actions/upload-artifact@v4
        with:
          name: wzsearch-${{ matrix.name }}
          path: wzsearch-${{ matrix.name }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true

  # Best-effort: GitHub's arm64 macOS runners are capacity-constrained and the
  # job may never be assigned a runner. It runs after the release exists and
  # never fails the workflow.
  build-macos:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    timeout-minutes: 20
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "pyinstaller>=6.6,<7"
      - run: pyinstaller --onefile --name wzsearch --paths src packaging/wzsearch_entry.py
      - run: chmod +x dist/wzsearch && zip -j wzsearch-macos.zip dist/wzsearch
      - uses: softprops/action-gh-release@v2
        with:
          files: wzsearch-macos.zip
