name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  # The shipped artifact is the Windows executable. The macOS app is built
  # locally (scripts/build_macos.sh) and is not part of the release.
  build-windows:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[gui]" "pyinstaller>=6.6,<7"
      # The version lives in one place (src/wzsearch/__init__.py); this writes
      # the PE resource the updater reads after downloading a release.
      - name: Version resource
        run: python scripts/make_version_info.py
      - name: Build the app
        run: >
          pyinstaller --onefile --windowed --name wzsearch --paths src
          --version-file packaging/version_info.txt
          --icon packaging\icon.ico
          --collect-all tkinterdnd2 --collect-all pillow_heif
          packaging/wzsearch_gui_entry.py
      # Required by SignPath: the artifact has to exist on the GitHub side
      # before the signing request. It is uploaded as a file, not a ZIP, so the
      # artifact configuration can describe a bare <pe-file>.
      - name: Upload the unsigned executable
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: wzsearch-unsigned
          path: dist/wzsearch.exe
          archive: false
      - name: SignPath configured?
        id: signpath
        shell: pwsh
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if ($env:TOKEN -and $env:ORG) {
            "configured=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Falta SIGNPATH_API_TOKEN e/ou SIGNPATH_ORGANIZATION_ID: o zip sai sem assinatura."
            "configured=false" >> $env:GITHUB_OUTPUT
          }
      - name: Sign with SignPath
        if: steps.signpath.outputs.configured == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: wzsearch
          signing-policy-slug: release-signing
          artifact-configuration-slug: wzsearch
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          skip-decompress: true
          output-artifact-directory: signed
      - name: Package the release zip
        shell: pwsh
        run: |
          if (Test-Path "signed/wzsearch.exe") {
            Copy-Item "signed/wzsearch.exe" "dist/wzsearch.exe" -Force
            Write-Host "Executavel assinado pela SignPath."
          } else {
            Write-Host "Sem assinatura: o updater so avisa, nao instala."
          }
          Compress-Archive -Path "dist/wzsearch.exe" -DestinationPath "wzsearch-windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: wzsearch-windows
          path: wzsearch-windows.zip

  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
