[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wzsearch"
version = "0.6.5"
description = "Search an exported WhatsApp conversation for keywords/regex and emit an occurrences CSV."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
gui = ["tkinterdnd2>=0.3", "Pillow>=10", "pillow-heif>=0.16"]

[project.scripts]
wzsearch = "wzsearch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wzsearch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "D", "ANN"]
ignore = ["D203", "D213", "D105", "D107", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["tkinterdnd2", "tkinterdnd2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["PIL", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pillow_heif", "pillow_heif.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
